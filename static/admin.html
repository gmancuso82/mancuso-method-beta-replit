<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mancuso Method Beta Admin</title>
  <style>
    :root {
      --bg: #12130f;
      --panel: #1b1d18;
      --panel-2: #22251f;
      --ink: #f2efe6;
      --soft: #cfc7b8;
      --muted: #898679;
      --line: #31342b;
      --accent: #d66d4c;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: #171914;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    h1 {
      font-size: 19px;
      margin: 0;
    }
    .sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }
    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 18px;
    }
    section {
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }
    article {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 13px;
    }
    .title {
      font-weight: 750;
      margin-bottom: 8px;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      color: var(--soft);
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    button {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
      color: var(--ink);
      padding: 8px 10px;
      font-weight: 700;
      cursor: pointer;
    }
    a {
      color: var(--ink);
      text-decoration: none;
    }
    .link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .link-card {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 9px 11px;
      color: var(--soft);
      font-size: 13px;
      font-weight: 750;
    }
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 7px;
      color: var(--soft);
      background: var(--panel-2);
      font-size: 11px;
      font-weight: 750;
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="top-row">
      <div>
        <h1>Mancuso Method Beta Admin</h1>
        <div class="sub">Profiles, Apple Health snapshots, memory, check-ins, conversations, and feedback from beta testing.</div>
      </div>
      <button id="refresh">Refresh</button>
    </div>
  </header>
  <main>
    <section>
      <h2>Tester Links</h2>
      <div class="link-row">
        <a class="link-card" id="freshLink" href="/?new=1">Fresh tester profile</a>
        <a class="link-card" href="/">Last local profile</a>
      </div>
    </section>
    <section>
      <h2>Users + Memory</h2>
      <div class="grid" id="users"></div>
    </section>
    <section>
      <h2>Connected Sources</h2>
      <div class="grid" id="integrations"></div>
    </section>
    <section>
      <h2>Apple Health Snapshots</h2>
      <div class="grid" id="appleHealth"></div>
    </section>
    <section>
      <h2>Recent Check-ins</h2>
      <div class="grid" id="checkins"></div>
    </section>
    <section>
      <h2>Conversations</h2>
      <div class="grid" id="conversations"></div>
    </section>
    <section>
      <h2>Feedback</h2>
      <div class="grid" id="feedback"></div>
    </section>
  </main>
  <script>
    function escapeHTML(text) {
      return String(text).replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[ch]));
    }

    function render(containerId, items, titleFn, metaFn, bodyFn) {
      const container = document.getElementById(containerId);
      if (!items.length) {
        container.innerHTML = `<article><div class="meta">No records yet.</div></article>`;
        return;
      }
      container.innerHTML = items.map(item => `
        <article>
          <div class="title">${escapeHTML(titleFn(item))}</div>
          <div class="meta">${escapeHTML(metaFn(item))}</div>
          <pre>${escapeHTML(bodyFn(item))}</pre>
        </article>
      `).join("");
    }

    function groupedIntegrations(items) {
      return (items || []).reduce((acc, item) => {
        const userId = item.user_id || "unknown";
        acc[userId] = acc[userId] || [];
        acc[userId].push(item);
        return acc;
      }, {});
    }

    function userLink(userId) {
      return `${window.location.origin}/?user_id=${encodeURIComponent(userId)}`;
    }

    async function load() {
      const response = await fetch("/api/admin/overview");
      const data = await response.json();
      const byUser = groupedIntegrations(data.integrations || []);
      document.getElementById("freshLink").href = `${window.location.origin}/?new=1`;
      render(
        "users",
        data.users || [],
        item => item.name || item.user_id || "Unknown user",
        item => `user_id: ${item.user_id || "unknown"} | updated: ${item.updated_at || "unknown"}`,
        item => {
          const integrations = byUser[item.user_id] || [];
          const sources = integrations.length
            ? integrations.map(src => `${src.provider}: ${src.connected ? "connected" : "not connected"} (${src.activity_count || 0} activities)`).join("\n")
            : "No connected sources yet.";
          return [
            `Open profile: ${userLink(item.user_id || "")}`,
            `Goals: ${(item.training_goals || item.fitness_goals || []).join(", ") || "none"}`,
            `Competition: ${item.upcoming_competition || item.upcoming_event || "none"}`,
            `Competition date: ${item.competition_date || "not entered"}`,
            `Experience: ${item.experience_level || "not entered"}`,
            `Sources:\n${sources}`,
            "",
            item.coach_memory_summary || "No memory summary yet.",
          ].join("\n");
        }
      );
      render(
        "integrations",
        data.integrations || [],
        item => `${item.user_id || "unknown"} | ${item.provider || "unknown source"}`,
        item => `connected: ${item.connected ? "yes" : "no"} | synced: ${item.last_sync_at || "not synced"} | activities: ${item.activity_count || 0}`,
        item => item.latest_activity ? JSON.stringify(item.latest_activity, null, 2) : "No synced activities yet."
      );
      render(
        "appleHealth",
        data.apple_health || [],
        item => `${item.user_id || "unknown"} | ${item.date || "unknown date"}`,
        item => `updated: ${item.updated_at || "unknown"} | source: ${item.source || "apple_health"}`,
        item => JSON.stringify(item, null, 2)
      );
      render(
        "checkins",
        data.checkins || [],
        item => `${item.user_id || "unknown"} | ${item.date || "unknown date"}`,
        item => `energy ${item.energy ?? "N/A"} | soreness ${item.soreness ?? "N/A"} | life load ${item.stress ?? "N/A"}`,
        item => JSON.stringify(item, null, 2)
      );
      render(
        "conversations",
        data.conversations || [],
        item => `${item.user_id || "unknown"} | ${item.date || "unknown date"}`,
        item => `messages: ${(item.messages || []).length} | updated: ${item.updated_at || "unknown"}`,
        item => (item.messages || []).map(m => `${m.role}: ${m.content}`).join("\n\n")
      );
      render(
        "feedback",
        data.feedback || [],
        item => `${item.user_id || "unknown"} | ${item.date || "unknown date"}`,
        item => `items: ${(item.items || []).length}`,
        item => JSON.stringify(item.items || [], null, 2)
      );
    }

    document.getElementById("refresh").addEventListener("click", load);
    load();
  </script>
</body>
</html>
